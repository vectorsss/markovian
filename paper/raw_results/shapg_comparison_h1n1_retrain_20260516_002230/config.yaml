characteristic_function:
  params:
    imputation_strategy: mean
    no_retrain: false
  type: model_based
dataset: h1n1
evaluation:
  enabled: true
  imputation_strategy: mean
  limit: 20
  retrain_kpi: true
  weighted_slope_beta: 0.8
explainers:
  kernel_shap:
    class: SHAPLibKernelExplainer
    graph_dependent: false
    params:
      n_background: 100
      n_explain: 100
      seed: 42
      verbose: true
  leverage_shap:
    class: LeverageScoreExplainer
    graph_dependent: false
    params:
      n_samples: 2000
      paired_sampling: true
      random_state: 42
      use_bernoulli: true
  markovian_empty:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      allow_leave: true
      min_improvement: 0.0
      seed: 42
      verbose: true
  markovian_full:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      allow_leave: true
      correlation_threshold: 0.0
      min_improvement: 0.0
      seed: 42
      verbose: true
  markovian_mi003:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      allow_leave: true
      correlation_threshold: 0.03
      min_improvement: 0.0
      seed: 42
      verbose: true
  sampling_shap:
    class: SHAPLibSamplingExplainer
    graph_dependent: false
    params:
      n_background: 100
      n_explain: 100
      seed: 42
      verbose: true
  shapg:
    class: ShapGExplainer
    params:
      approximate_by_ratio: false
      depth: 1
      n_samples: 3
      scale: false
graphs:
  rank_deletion_cosine:
    method: from_rank_deletion
    params:
      correlation_method: cosine
      density_ratio: null
      similarity_method: cosine
      use_mixed_similarity: false
  rank_deletion_mutual_info:
    method: from_rank_deletion
    params:
      correlation_method: mutual_info
      density_ratio: null
      similarity_method: mutual_info
      use_mixed_similarity: false
model:
  params:
    n_estimators: 100
    random_state: 10
    verbosity: -1
  train_test_split:
    random_state: 10
    test_size: 0.2
  type: LGBMClassifier
plot:
  dpi: 300
  figsize:
  - 12
  - 8
seed: 42
