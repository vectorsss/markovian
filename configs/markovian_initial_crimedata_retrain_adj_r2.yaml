      temperature: 0.5
      correlation_threshold: 0.0
characteristic_function:
  type: model_based
  params:
    no_retrain: false
    imputation_strategy: mean
evaluation:
  enabled: true
  limit: 20
  retrain_kpi: true
  adjusted_r2: true
  imputation_strategy: mean
  weighted_slope_beta: 0.8
seed: 42
plot:
  figsize:
  - 12
  - 8
  dpi: 300
