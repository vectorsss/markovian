      allow_leave: true
      min_improvement: 0.0
      n_scenarios: 50
      verbose: true
      strategy: softmax
      temperature: 0.1
      correlation_threshold: 0.0
  markovian_top_p_09_t01_empty:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      seed: 42
      allow_leave: true
      min_improvement: 0.0
      n_scenarios: 50
      verbose: true
      strategy: top_p
      strategy_param: 0.9
      temperature: 0.1
  markovian_top_p_09_t01_rho:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      seed: 42
      allow_leave: true
      min_improvement: 0.0
