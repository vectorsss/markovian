# Experiment: Markovian strategy x initial set (crimedata, retrain mode, adjusted R²)
# 6 strategies x 3 initial sets = 18 methods, n_scenarios=50
# Usage: python run_benchmark.py configs/markovian_initial_crimedata_retrain_adj_r2.yaml

dataset: crimedata
model:
  type: LGBMRegressor
  params:
    n_estimators: 100
    random_state: 42
    verbosity: -1
  train_test_split:
    test_size: 0.2
    random_state: 42
graphs:
  kendalltau:
    method: from_kendalltau_minimal_edge
    params:
      reverse: true
      version: v3
explainers:
  markovian_greedy_empty:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      seed: 42
      allow_leave: true
      min_improvement: 0.0
      n_scenarios: 1
      verbose: true
      strategy: greedy
  markovian_greedy_rho:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      seed: 42
      allow_leave: true
      min_improvement: 0.0
      n_scenarios: 1
      verbose: true
      strategy: greedy
      correlation_threshold: 0.6
  markovian_greedy_full:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      seed: 42
      allow_leave: true
      min_improvement: 0.0
      n_scenarios: 1
      verbose: true
      strategy: greedy
      correlation_threshold: 0.0
  markovian_linear_empty:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      seed: 42
      allow_leave: true
      min_improvement: 0.0
      n_scenarios: 50
      verbose: true
      strategy: linear
  markovian_linear_rho:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      seed: 42
      allow_leave: true
      min_improvement: 0.0
      n_scenarios: 50
      verbose: true
      strategy: linear
      correlation_threshold: 0.6
  markovian_linear_full:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      seed: 42
      allow_leave: true
      min_improvement: 0.0
      n_scenarios: 50
      verbose: true
      strategy: linear
      correlation_threshold: 0.0
  markovian_softmax_01_empty:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      seed: 42
      allow_leave: true
      min_improvement: 0.0
      n_scenarios: 50
      verbose: true
      strategy: softmax
      temperature: 0.1
  markovian_softmax_01_rho:
    class: MarkovianExplainer
    graph_dependent: false
    params:
