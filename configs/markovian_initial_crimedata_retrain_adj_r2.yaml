      min_improvement: 0.0
      n_scenarios: 50
      verbose: true
      strategy: top_k
      strategy_param: 3
  markovian_top_k_3_rho:
    class: MarkovianExplainer
    graph_dependent: false
    params:
      seed: 42
      allow_leave: true
      min_improvement: 0.0
      n_scenarios: 50
      verbose: true
      strategy: top_k
      strategy_param: 3
      correlation_threshold: 0.6
  markovian_top_k_3_full:
